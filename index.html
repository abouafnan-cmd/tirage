<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعلم الإنجليزية - سورة البقرة</title>
    <!-- ربط ملف التنسيقات -->
    <link rel="stylesheet" href="css/style.css">
    <!-- ربط ملف الـ Manifest لتطبيق الأندرويد -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">
        <!-- شريط الإعدادات الجديد (الوضع الليلي والخطوط) -->
        <div class="settings-bar">
            <button id="theme-toggle-btn" title="تغيير المظهر">🌙 الوضع الليلي</button>
            <div class="font-sizer">
                <span>الخط:</span>
                <button id="font-decrease-btn">-</button>
                <button id="font-increase-btn">+</button>
            </div>
        </div>

        <header>
            <h1>سورة البقرة - تعلم الإنجليزية</h1>
            <p>أدخل رقم الآية لعرض الترجمة (تقي الدين الهلالي ومحسن خان)</p>
        </header>

        <section class="search-section">
            <input type="number" id="verse-input" placeholder="أدخل رقم الآية (مثال: 2)" min="1" max="286">
            <button id="search-btn">ابحث عن الآية</button>
        </section>

        <!-- هذه المنطقة ستكون مخفية حتى يتم البحث -->
        <main id="result-container" class="hidden">
            <div class="card quran-text">
                <h3>النص القرآني:</h3>
                <p id="arabic-text"></p>
            </div>

            <div class="card translation-text">
                <h3>الترجمة الإنجليزية:</h3>
                <p id="english-text" dir="ltr"></p>
                <button id="play-audio-btn">🔊 استمع للترجمة</button>
                
                <!-- خيارات التحكم في سرعة الصوت -->
                <div class="speed-controls">
                    <span class="speed-label">سرعة القراءة:</span>
                    <button class="speed-btn" data-speed="0.5">بطء كثير (0.5x)</button>
                    <button class="speed-btn active" data-speed="0.8">بطء متوسط (0.8x)</button>
                    <button class="speed-btn" data-speed="1.0">عادي (1.0x)</button>
                </div>
            </div>

            <div class="card linguistic-notes">
                <h3>إضاءات لغوية:</h3>
                <div id="grammar-note"></div>
                <h4>أهم المفردات:</h4>
                <ul id="vocabulary-list"></ul>
            </div>
        </main>
    </div>

    <!-- ربط ملف البرمجة -->
    <script src="js/app.js"></script>
</body>
</html>
